name: "✎ FEEDBACK · what you wish MADRE did"
description: An idea, a rough edge, a wish. The crew reads everything.
title: "[feedback] "
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        ```
        MU/TH/UR 6000 · INTERFACE 2037 · THE CREW IS LISTENING
        ```
