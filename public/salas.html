<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050605">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MADRE">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>MADRE</title>
    <link rel="manifest" href="/bridge/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/assets/brand/madre-favicon.svg">
    <link rel="apple-touch-icon" href="/assets/brand/madre-app-180.png">
    <link rel="stylesheet" href="/bridge/styles.css">
    <link rel="stylesheet" href="/bridge/salas.css">
  </head>
  <body class="salas">
    <header class="salas-top">
      <span class="salas-brand" aria-label="MADRE">
        <svg class="brand-logo" viewBox="-4.8 -4.8 377.1 49.6" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><g class="pulse" transform="translate(0 0) scale(2.5) translate(0 -2)"><path class="beat" d="M1 10H16L20 10L23.5 2L28 18L32 10L35 10L37 6L39 10H52" stroke-width="1.92" pathLength="100"/><circle class="beat-dot" cx="60" cy="10" r="3" stroke="none"/></g><g class="word" transform="translate(193.5 7)" stroke-width="4.8"><path d="M0 26V0L14 14.3L28 0V26"/><path transform="translate(36.5 0)" d="M0 26V7.8A7.8 7.8 0 0 1 7.8 0H17.2A7.8 7.8 0 0 1 25 7.8V26M0 15.6H25"/><path transform="translate(71.5 0)" d="M0 0H16A12 12 0 0 1 28 12V14A12 12 0 0 1 16 26H0Z"/><path transform="translate(110.5 0)" d="M0 26V0H20.85A7.15 7.15 0 0 1 28 7.15V7.15A7.15 7.15 0 0 1 20.85 14.3H0M15.12 14.3L28 26"/><path transform="translate(146 0)" d="M28 0H0V26H28M0 13H21"/></g></g></svg>
      </span>
      <span id="salas-mac" class="salas-mac"></span>
      <button id="salas-stop" class="salas-stop" type="button" hidden>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-icon="stop"><rect x="5.4" y="5.4" width="9.2" height="9.2" rx="2.6" fill="currentColor" stroke="none"/></svg>
        <span>Stop all</span>
      </button>
    </header>
    <main class="salas-main">
      <button id="salas-continue" class="salas-continue" type="button" hidden></button>
      <h1 class="salas-title">Home</h1>
      <ul id="salas-list" class="salas-list" aria-live="polite"></ul>
      <p id="salas-empty" class="salas-empty" hidden></p>
      <p id="salas-foot" class="salas-foot"></p>
    </main>
    <div id="salas-welcome" class="salas-welcome" hidden role="dialog" aria-modal="true" aria-labelledby="salas-welcome-title">
      <section class="salas-sheet">
        <span class="salas-check" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-icon="check"><path d="M4.6 10.4l3.6 3.6 7.2-7.6"/></svg></span>
        <h2 id="salas-welcome-title"></h2>
        <p id="salas-welcome-text"></p>
        <ol id="salas-welcome-steps" class="salas-steps"></ol>
        <button id="salas-welcome-ok" class="salas-primary" type="button"></button>
      </section>
    </div>
    <script type="module" src="/bridge/salas.js"></script>
  </body>
</html>
